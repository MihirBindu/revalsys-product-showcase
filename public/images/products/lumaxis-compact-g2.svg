<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a pocketable compact camera with a fixed lens">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Small slab body, no hump — reads as pocketable next to the mirrorless -->
  <rect x="286" y="236" width="228" height="148" rx="18" fill="#ffffff" opacity="0.96"/>
  <!-- Modest fixed lens, offset left -->
  <circle cx="360" cy="310" r="52" fill="#be123c" opacity="0.5"/>
  <circle cx="360" cy="310" r="34" fill="#ffffff" opacity="0.9"/>
  <circle cx="360" cy="310" r="18" fill="#be123c" opacity="0.6"/>
  <!-- Flash and shutter -->
  <rect x="440" y="256" width="44" height="18" rx="9" fill="#be123c" opacity="0.35"/>
  <circle cx="470" cy="352" r="11" fill="#be123c" opacity="0.35"/>
</svg>
