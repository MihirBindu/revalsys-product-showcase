<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a foldable phone opened flat like a small tablet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Two panels joined at a central hinge -->
  <rect x="222" y="150" width="176" height="300" rx="18" fill="#ffffff" opacity="0.96"/>
  <rect x="402" y="150" width="176" height="300" rx="18" fill="#ffffff" opacity="0.96"/>
  <rect x="240" y="170" width="140" height="260" rx="10" fill="#92400e" opacity="0.24"/>
  <rect x="420" y="170" width="140" height="260" rx="10" fill="#92400e" opacity="0.24"/>
  <!-- Hinge -->
  <rect x="392" y="150" width="16" height="300" rx="8" fill="#ffffff" opacity="0.85"/>
  <rect x="396" y="270" width="8" height="60" rx="4" fill="#92400e" opacity="0.4"/>
</svg>
