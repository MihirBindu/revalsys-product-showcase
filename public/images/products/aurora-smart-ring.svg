<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a titanium smart ring shown at an angle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Band: thick ring, the whole product -->
  <circle cx="400" cy="300" r="118" fill="none" stroke="#ffffff" stroke-width="52" opacity="0.94"/>
  <!-- Inner edge shading to give the band depth -->
  <circle cx="400" cy="300" r="94" fill="none" stroke="#115e59" stroke-width="6" opacity="0.25"/>
  <!-- Sensor cluster on the inner surface -->
  <circle cx="400" cy="404" r="13" fill="#115e59" opacity="0.45"/>
  <circle cx="368" cy="396" r="8" fill="#115e59" opacity="0.35"/>
  <circle cx="432" cy="396" r="8" fill="#115e59" opacity="0.35"/>
</svg>
