<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a tenkeyless mechanical keyboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Board: wide and shallow, no number pad -->
  <rect x="176" y="216" width="448" height="176" rx="22" fill="#ffffff" opacity="0.96"/>
  <!-- Key rows -->
  <g fill="#065f46" opacity="0.32">
    <rect x="200" y="240" width="30" height="26" rx="6"/><rect x="238" y="240" width="30" height="26" rx="6"/>
    <rect x="276" y="240" width="30" height="26" rx="6"/><rect x="314" y="240" width="30" height="26" rx="6"/>
    <rect x="352" y="240" width="30" height="26" rx="6"/><rect x="390" y="240" width="30" height="26" rx="6"/>
    <rect x="428" y="240" width="30" height="26" rx="6"/><rect x="466" y="240" width="30" height="26" rx="6"/>
    <rect x="504" y="240" width="30" height="26" rx="6"/><rect x="542" y="240" width="58" height="26" rx="6"/>
    <rect x="200" y="276" width="44" height="26" rx="6"/><rect x="252" y="276" width="30" height="26" rx="6"/>
    <rect x="290" y="276" width="30" height="26" rx="6"/><rect x="328" y="276" width="30" height="26" rx="6"/>
    <rect x="366" y="276" width="30" height="26" rx="6"/><rect x="404" y="276" width="30" height="26" rx="6"/>
    <rect x="442" y="276" width="30" height="26" rx="6"/><rect x="480" y="276" width="30" height="26" rx="6"/>
    <rect x="518" y="276" width="82" height="26" rx="6"/>
    <rect x="200" y="312" width="56" height="26" rx="6"/><rect x="264" y="312" width="30" height="26" rx="6"/>
    <rect x="302" y="312" width="30" height="26" rx="6"/><rect x="340" y="312" width="30" height="26" rx="6"/>
    <rect x="378" y="312" width="30" height="26" rx="6"/><rect x="416" y="312" width="30" height="26" rx="6"/>
    <rect x="454" y="312" width="30" height="26" rx="6"/><rect x="492" y="312" width="108" height="26" rx="6"/>
  </g>
  <!-- Spacebar -->
  <rect x="300" y="350" width="200" height="26" rx="8" fill="#065f46" opacity="0.32"/>
