<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a full-frame mirrorless camera with a large lens and viewfinder hump">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Viewfinder hump and shutter, marking it as the pro body -->
  <rect x="360" y="168" width="88" height="44" rx="12" fill="#ffffff" opacity="0.94"/>
  <rect x="470" y="184" width="34" height="18" rx="9" fill="#ffffff" opacity="0.8"/>
  <!-- Body -->
  <rect x="234" y="210" width="332" height="196" rx="26" fill="#ffffff" opacity="0.96"/>
  <!-- Large lens -->
  <circle cx="400" cy="308" r="86" fill="#881337" opacity="0.55"/>
  <circle cx="400" cy="308" r="60" fill="#ffffff" opacity="0.9"/>
  <circle cx="400" cy="308" r="34" fill="#881337" opacity="0.6"/>
  <circle cx="380" cy="288" r="10" fill="#ffffff" opacity="0.75"/>
  <!-- Grip -->
  <rect x="234" y="234" width="46" height="148" rx="20" fill="#881337" opacity="0.22"/>
</svg>
