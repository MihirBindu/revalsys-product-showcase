<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a smartwatch with a square display and heart-rate reading">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f5f57"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Straps -->
  <rect x="352" y="128" width="96" height="86" rx="20" fill="#ffffff" opacity="0.72"/>
  <rect x="352" y="386" width="96" height="86" rx="20" fill="#ffffff" opacity="0.72"/>
  <!-- Square case with rounded corners -->
  <rect x="322" y="200" width="156" height="200" rx="42" fill="#ffffff" opacity="0.96"/>
  <rect x="346" y="224" width="108" height="152" rx="28" fill="#0f5f57" opacity="0.32"/>
  <!-- Heart-rate trace on the face -->
  <path d="M362 300h20l12-22 16 44 14-30 10 8h24" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crown -->
  <rect x="478" y="272" width="14" height="40" rx="7" fill="#ffffff" opacity="0.9"/>
</svg>
