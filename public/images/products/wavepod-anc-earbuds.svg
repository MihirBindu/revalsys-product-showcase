<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of true wireless earbuds beside their charging case">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Two buds: rounded body with a downward stem -->
  <g fill="#ffffff" opacity="0.94">
    <circle cx="286" cy="252" r="46"/>
    <rect x="272" y="286" width="28" height="86" rx="14"/>
    <circle cx="394" cy="252" r="46"/>
    <rect x="380" y="286" width="28" height="86" rx="14"/>
  </g>
  <circle cx="286" cy="252" r="18" fill="#4c1d95" opacity="0.35"/>
  <circle cx="394" cy="252" r="18" fill="#4c1d95" opacity="0.35"/>
  <!-- Charging case -->
  <rect x="470" y="272" width="140" height="104" rx="24" fill="#ffffff" opacity="0.94"/>
  <rect x="470" y="272" width="140" height="12" rx="6" fill="#4c1d95" opacity="0.28"/>
  <circle cx="540" cy="356" r="7" fill="#4c1d95" opacity="0.4"/>
</svg>
