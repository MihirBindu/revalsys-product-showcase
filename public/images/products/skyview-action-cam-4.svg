<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a rugged cube-shaped waterproof action camera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Squat cube body -->
  <rect x="304" y="212" width="192" height="176" rx="26" fill="#ffffff" opacity="0.96"/>
  <!-- Protruding lens barrel -->
  <circle cx="400" cy="300" r="64" fill="#a21caf" opacity="0.5"/>
  <circle cx="400" cy="300" r="44" fill="#ffffff" opacity="0.92"/>
  <circle cx="400" cy="300" r="24" fill="#a21caf" opacity="0.62"/>
  <!-- Mounting fingers along the base -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="332" y="388" width="22" height="34" rx="8"/>
    <rect x="366" y="388" width="22" height="34" rx="8"/>
    <rect x="400" y="388" width="22" height="34" rx="8"/>
    <rect x="434" y="388" width="22" height="34" rx="8"/>
  </g>
</svg>
