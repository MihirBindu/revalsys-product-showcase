<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a compact cube Bluetooth speaker with a perforated grille">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#86198f"/>
    </linearGradient>
    <pattern id="grille" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="5" fill="#86198f" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Cube body -->
  <rect x="304" y="204" width="192" height="192" rx="30" fill="#ffffff" opacity="0.94"/>
  <rect x="330" y="230" width="140" height="140" rx="16" fill="url(#grille)"/>
  <!-- Carry strap -->
  <path d="M496 250h34a20 20 0 0 1 0 40h-34" stroke="#ffffff" stroke-width="16" fill="none" opacity="0.8" stroke-linecap="round"/>
</svg>
