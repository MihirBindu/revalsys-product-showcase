<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of over-ear studio headphones">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Headband -->
  <path d="M268 320a132 132 0 0 1 264 0" stroke="#ffffff" stroke-width="26" fill="none" opacity="0.94" stroke-linecap="round"/>
  <!-- Ear cups, larger than earbud circles to read as over-ear -->
  <rect x="230" y="300" width="86" height="128" rx="34" fill="#ffffff" opacity="0.94"/>
  <rect x="484" y="300" width="86" height="128" rx="34" fill="#ffffff" opacity="0.94"/>
  <rect x="252" y="326" width="42" height="76" rx="21" fill="#6b21a8" opacity="0.3"/>
  <rect x="506" y="326" width="42" height="76" rx="21" fill="#6b21a8" opacity="0.3"/>
</svg>
