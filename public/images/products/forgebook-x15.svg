<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a large 15-inch performance laptop with a lit keyboard deck">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3f7a"/>
      <stop offset="100%" stop-color="#0d1430"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Larger, squarer lid -->
  <rect x="216" y="150" width="368" height="228" rx="10" fill="#ffffff" opacity="0.94"/>
  <rect x="238" y="172" width="324" height="184" rx="5" fill="#0d1430" opacity="0.34"/>
  <!-- Thicker base with an accent strip for the backlit deck -->
  <path d="M180 378h440l30 40H150z" fill="#ffffff" opacity="0.94"/>
  <rect x="214" y="392" width="372" height="8" rx="4" fill="#7aa2ff" opacity="0.85"/>
  <rect x="344" y="406" width="112" height="6" rx="3" fill="#0d1430" opacity="0.3"/>
</svg>
